<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span onMouseEnter="{{ onIn }}" onMouseLeave="{{ onOut }}" style="position:relative; display:inline-flex; align-items:center; vertical-align:middle; flex:0 0 auto">
  <span style="width:15px; height:15px; border:1.3px solid #1c589c; border-radius:50%; color:#1c589c; background:#ffffff; font-size:10px; font-weight:700; font-style:normal; line-height:1; display:inline-flex; align-items:center; justify-content:center; cursor:pointer">i</span>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute; top:22px; left:{{ l }}; right:{{ r }}; z-index:60; width:340px; max-width:min(340px, calc(100vw - 32px)); padding:12px 16px 10px; background:#ffffff; border:1px solid #cdd1d5; border-top:3px solid #063a74; border-radius:4px; box-shadow:0 8px 22px rgba(5,43,87,0.16); font-size:13px; font-weight:400; color:#1e2124; line-height:1.6; text-align:left; white-space:normal; word-break:keep-all">
      <sc-if value="{{ hasTitle }}" hint-placeholder-val="{{ true }}"><div style="font-size:14px; font-weight:700; color:#063a74; padding-bottom:8px; margin-bottom:4px; border-bottom:1px solid #e3e6e8">{{ title }}</div></sc-if>
      <sc-for list="{{ rows }}" as="t" hint-placeholder-count="2">
        <div style="display:grid; grid-template-columns:{{ cols }}; gap:10px; padding:4px 0"><sc-if value="{{ t.hasK }}" hint-placeholder-val="{{ true }}"><span style="color:#5b6167; font-weight:700">{{ t.k }}</span></sc-if><span style="color:#1e2124">{{ t.v }}</span></div>
      </sc-for>
    </div>
  </sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 400, &quot;height&quot;: 200}, &quot;info&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;산식: 자퇴 + 퇴학 학생 수\n내용: 아래 = 전년 대비 증감&quot;, &quot;tsType&quot;: &quot;string | {title, rows}&quot;}, &quot;title&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false, side: 'l' };
  renderVals() {
    const raw = this.props.info;
    let title = this.props.title || '', rows = [];
    if (raw && typeof raw === 'object') { title = raw.title || title; rows = (raw.rows || []).map(r => ({ k: r.k || '', v: r.v || '' })); }
    else if (raw) {
      String(raw).split(/\n| · /).map(x => x.trim()).filter(Boolean).forEach(line => {
        const m = line.match(/^([^:：]{1,8})\s*[:：]\s*(.+)$/);
        rows.push(m ? { k: m[1], v: m[2] } : { k: '', v: line });
      });
    }
    const anyK = rows.some(r => r.k);
    return {
      open: this.state.open, title, hasTitle: !!title,
      rows: rows.map(r => Object.assign(r, { hasK: anyK })), cols: anyK ? '64px minmax(0,1fr)' : 'minmax(0,1fr)',
      l: this.state.side === 'r' ? 'auto' : '-6px', r: this.state.side === 'r' ? '-6px' : 'auto',
      onIn: e => { const x = e && e.currentTarget ? e.currentTarget.getBoundingClientRect().left : 0; this.setState({ open: true, side: x > window.innerWidth / 2 ? 'r' : 'l' }); },
      onOut: () => this.setState({ open: false })
    };
  }
}
</script>
</body>
</html>
